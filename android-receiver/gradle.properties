# Gradle 自身的参数。
#
# 不写 org.gradle.java.home：构建用的 JDK 由 JAVA_HOME 决定（命令行里设，或者
# Android Studio 用它自带的 JDK），写死路径会让这个工程换台机器就跑不起来。

# 编译 Kotlin/Java 时用 2G 堆足够；同时固定文件编码为 UTF-8，
# 否则 Windows 上默认 GBK，源码里的中文注释和 strings.xml 会乱码。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 必须开：本工程用的是 AndroidX（Media3），不开会报 "This project uses AndroidX..." 。
android.useAndroidX=true

# 不生成逐模块的 R 类，只生成自己模块的。
# 本工程只有一个模块，收益是编译快一点点、R 类小一点点。
android.nonTransitiveRClass=true

# 并行的 Gradle 参数留着（只有一个模块时几乎没区别，但多模块扩展时省事）。
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
