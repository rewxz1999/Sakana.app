# Gradle Wrapper 配置。
#
# 为什么固定 8.14.3：它是本机 Gradle 缓存里已经存在的发行包（离线也能用），
# 同时满足 AGP 8.13.0 要求的 Gradle >= 8.13。
#
# 说明：下面的 distributionUrl 指向腾讯云镜像。改成官方地址也可以，只是这台机器上
# 官方地址下载不下来（连得上但读不动），而镜像对应的发行包已经在本地缓存里。
#   官方：distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
