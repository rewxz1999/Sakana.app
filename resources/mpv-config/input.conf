# ═══════════════════════════════════════════════════════════════════════════════
# Sakana 播放器 · mpv 键位绑定（uosc 控制栏配套）
#
# 生效条件：mpv 必须以 `--config=yes` 启动、且 config-dir 指向本目录
# （src/main/services/mpv.ts 里两处都设了）。libmpv 默认 config=no，
# 那样连 mp.find_config_file() 都返回 nil —— 这份文件**一个字节都不会被读到**（实测）。
#
# 设计原则：这里几乎不写「直接改播放状态」的 mpv 命令，而是转成应用能认的动作：
#     script-message sakana-ctrl  <动作> [参数…]      ← 与 uosc 控制栏按钮同一条路
#     script-message sakana-menu  <菜单名>            ← 让 uosc 弹出应用提供的菜单
# 由 resources/mpv-scripts/sakana-uosc-ctrl.lua 转发给 Electron 主进程，
# 因此快捷键与按钮的行为、状态同步、日志完全一致（不存在两套逻辑）。
# 只有「播放/暂停」和「音量」用原生命令：它们本来就是 mpv 的属性，
# 原生执行零延迟，应用侧状态由主进程的事件泵同步回来。
#
# 与「设置 → 播放器设置 → 播放器快捷键」的关系：
#   应用那套是渲染层监听 keydown，只在 Electron 窗口有键盘焦点时生效；
#   这份在 mpv 输出子窗口拿到焦点时生效（点过画面之后就是这种情况）。
#   Windows 的键盘事件只会送到有焦点的那个窗口，所以两套不会同时触发、不会打架。
#   uosc 自己打开的菜单用 forced 键位（优先级高于本文件），
#   菜单打开时 Esc / ↑↓ / Enter / 输入搜索都由菜单接管 —— 这正是想要的行为。
# ═══════════════════════════════════════════════════════════════════════════════


# ── 播放 / 进度 ───────────────────────────────────────────────────────────────
SPACE               cycle pause                                  # 播放 / 暂停（原生，零延迟）
RIGHT               script-message sakana-ctrl forward10          # 前进 10 秒（走应用，转码流也能正确重启）
LEFT                script-message sakana-ctrl back10             # 后退 10 秒
n                   script-message sakana-ctrl next-episode       # 下一集（与应用的默认快捷键一致）
p                   script-message sakana-ctrl prev-episode       # 上一集

# ── 音量 ─────────────────────────────────────────────────────────────────────
UP                  add volume 10                                # 音量 +10（改的是 mpv 的 volume 属性，
DOWN                add volume -10                               #   与 uosc 右侧竖排滑杆同一个值）
m                   cycle mute                                   # 静音开关

# ── 菜单（由 sakana-uosc-ctrl.lua 用 uosc 的 open-menu 现场生成） ──────────────
l                   script-message sakana-menu episodes          # 选集（含线路子菜单，当前集高亮）
Ctrl+l              script-message sakana-menu lines             # 线路切换（保持当前集号，越界自动收敛）
c                   script-message sakana-menu subtitle          # 字幕选择（含「关闭字幕」）
x                   script-message sakana-menu speed             # 播放倍速 0.5x–3x（走应用的变速逻辑）
a                   script-message sakana-menu aspect            # 画面比例（适应 / 裁剪铺满 / 拉伸铺满）
d                   script-message sakana-menu danmaku           # 弹幕设置（开关 / 区域 / 数量 / 时间轴 / 类型）

# ── 其它控件 ─────────────────────────────────────────────────────────────────
i                   script-message sakana-ctrl toggle-info       # 番剧详情浮层（由应用的悬浮窗绘制）
s                   script-message sakana-ctrl snapshot          # 截图
f                   script-message sakana-ctrl toggle-fullscreen # 全屏 / 退出全屏（改的是 Electron 窗口）
Ctrl+d              script-message sakana-ctrl toggle-danmaku    # 弹幕开 / 关
Ctrl+Shift+d        script-message sakana-ctrl open-danmaku-settings  # 打开完整弹幕设置窗口
ESC                 script-message sakana-ctrl escape            # 依次：关面板 → 退全屏 → 退出播放
q                   script-message sakana-ctrl exit              # 退出播放（不是退出应用）

# ── 鼠标 ─────────────────────────────────────────────────────────────────────
# 这里**故意不绑鼠标键**：uosc 自己用 forced 键位（mp.set_key_bindings(..., 'force')）
# 接管了 MPV 的 mbtn_left / mbtn_right / wheel（它的按钮、进度条拖动、滚轮都靠这套），
# forced 键位的优先级高于本文件，写在这里也不会生效（见 scripts/uosc/lib/cursor.lua）。
